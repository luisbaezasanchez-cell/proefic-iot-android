# TEMPORAL. Se borra en cuanto se haya visto pasar.
#
# Segunda y última comprobación: de dónde sale el aviso de Gradle "Deprecated
# Gradle features were used in this build". Si es de los ficheros de este
# repositorio hay que corregirlo; si es del plugin de Android, no.

name: Ensayo temporal

on:
  push:
    branches: ['claude/quirky-archimedes-21i6ml']

permissions:
  contents: read

jobs:
  ensayo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Usar el JDK 17 de la máquina
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Avisos de obsolescencia, con su origen
        run: |
          ./gradlew --warning-mode all lint assembleDebug bundleRelease > salida.txt 2>&1 || { tail -n 40 salida.txt; exit 1; }
          grep -n -i -B 1 -A 6 "deprecat" salida.txt | head -n 80 || echo "Ningún aviso de obsolescencia."
          grep -n "errors, .* warnings" salida.txt
          ls -l app/build/outputs/bundle/release/ app/build/outputs/apk/debug/
